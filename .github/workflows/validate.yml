name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PR targets the default branch
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
        run: python3 -I skills/ship-git/scripts/gitctl.py check-pr-base --base "$PR_BASE"
      - name: Install skills and tooling
        run: python3 -I scripts/install.py
      - name: System health
        run: python3 -I scripts/doctor.py
      - name: Regression evals
        run: python3 -I skills/ship-eval/scripts/evalctl.py run
      - name: Checkout is unchanged
        run: git diff --exit-code
